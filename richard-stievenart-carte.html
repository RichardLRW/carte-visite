<title>Richard Stiévenart</title>
<style>
  :root {
    --bg: #f5f5f3;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --accent: #d9aa59;
    --accent-soft: #faf3e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111214; --card: #1c1d21; --text: #f2f2f4; --muted: #9a9aa3;
      --accent: #d9aa59; --accent-soft: #2e2619;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100%;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 36px 28px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  .photo {
    width: 120px; height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 18px;
    display: block;
    background: var(--accent-soft);
  }
  .photo.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 600; color: var(--accent);
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .title { color: var(--muted); font-size: 15px; margin: 0 0 28px; line-height: 1.4; }

  .action {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 15px 16px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform .08s ease, opacity .2s;
  }
  .action:active { transform: scale(.98); }
  .action.linkedin { background: var(--accent); color: #1d1d1f; }
  .action.phone { background: var(--accent-soft); color: var(--accent); }
  .action small { display: block; font-size: 13px; opacity: .8; font-weight: 400; }
  .action .label { text-align: left; }
  .action .value { font-weight: 600; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.5; }
  .icon { width: 22px; height: 22px; flex-shrink: 0; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: all .3s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

/* ============================================================ */

const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function esc(v) {
  return String(v || "")
    .replace(/\\/g, "\\\\")
    .replace(/;/g, "\\;")
    .replace(/,/g, "\\,")
    .replace(/\r?\n/g, "\\n");
}

function fold(line) {
  if (line.length <= 75) return line;
  const parts = [line.slice(0, 75)];
  let rest = line.slice(75);
  while (rest.length > 74) {
    parts.push(" " + rest.slice(0, 74));
    rest = rest.slice(74);
  }
  if (rest.length) parts.push(" " + rest);
  return parts.join("\r\n");
}

function buildVCard() {
  const c = CONTACT;
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${esc(c.lastName)};${esc(c.firstName)};;;`,
    `FN:${esc(c.firstName + " " + c.lastName)}`,
    `ORG:${esc(c.org)}`,
    `TITLE:${esc(c.title)}`,
    `TEL;TYPE=CELL,VOICE:${esc(c.phone)}`,
    `EMAIL;TYPE=INTERNET:${esc(c.email)}`,
    `URL:${c.linkedin}`
  ];
  if (c.photo && c.photo.startsWith("data:image/")) {
    lines.push(`PHOTO;ENCODING=b;TYPE=JPEG:${c.photo.split(",")[1]}`);
  }
  lines.push("END:VCARD");
  return lines.map(fold).join("\r\n") + "\r\n";
}

function downloadVCard() {
  const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${CONTACT.firstName}-${CONTACT.lastName}.vcf`.replace(/\s+/g, "-");
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast("Fiche prête à être ajoutée à vos contacts");
}

function init() {
  const c = CONTACT;
  const fullName = `${c.firstName} ${c.lastName}`;

  document.title = fullName;
  $("fullname").textContent = fullName;
  $("jobtitle").textContent = `${c.title} · ${c.org}`;

  const photoEl = $("photo");
  if (c.photo && c.photo.startsWith("data:image/")) {
    const img = document.createElement("img");
    img.src = c.photo;
    img.alt = fullName;
    img.className = "photo";
    photoEl.appendChild(img);
  } else {
    const initials = document.createElement("div");
    initials.className = "photo placeholder";
    initials.textContent = (c.firstName[0] || "") + (c.lastName[0] || "");
    photoEl.appendChild(initials);
  }

  $("linkedin-btn").href = c.linkedin;
  $("linkedin-label").textContent = fullName;

  $("phone-label").textContent = c.phone;
  $("phone-btn").addEventListener("click", downloadVCard);
}

init();
</script>
